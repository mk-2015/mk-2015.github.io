name: Build & Deploy inetdotlib.ftp.sh

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1" # Weekly refresh on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install full manpage suites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            manpages manpages-dev \
            manpages-posix manpages-posix-dev \
            groff bsdextrautils

      - name: Render all sections (1-8) into _site/shelf/man/
        run: |
          mkdir -p _site
          cp -r * _site/ 2>/dev/null || true
          rm -rf _site/_site _site/.git _site/.github

          python3 - <<'EOF'
          import html
          import os
          import subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          base_out = Path("_site/shelf/man")
          base_out.mkdir(parents=True, exist_ok=True)

          SECTIONS = {
              "1": "Executable programs or shell commands",
              "2": "System calls (kernel functions)",
              "3": "Library calls (functions within program libraries)",
              "4": "Special files (usually found in /dev)",
              "5": "File formats and conventions",
              "6": "Games",
              "7": "Miscellaneous (macro packages and conventions)",
              "8": "System administration commands",
          }

          def render_one(task):
              sec, gz_path = task
              sec_dir = base_out / sec
              stem = gz_path.name[:-3] if gz_path.name.endswith(".gz") else gz_path.name
              name = stem.rsplit(".", 1)[0]
              # Sanitize slashes or weird characters in filenames
              safe_file = name.replace("/", "_") + ".html"

              res = subprocess.run(
                  ["groff", "-man", "-Tutf8", "-P-c", "-P-b", "-P-u", str(gz_path)],
                  capture_output=True,
                  text=True,
                  errors="replace",
                  check=False,
              )
              if res.returncode != 0 or not res.stdout.strip():
                  return None

              page_html = (
                  "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n"
                  "  <meta charset=\"UTF-8\">\n"
                  f"  <title>{html.escape(name)}({sec}) - inetdotlib.ftp.sh</title>\n"
                  "</head>\n<body>\n"
                  f"  <p><a href=\"/\">Home</a> | <a href=\"/shelf/man/\">man</a> | <a href=\"/shelf/man/{sec}/\">man({sec})</a></p>\n"
                  "  <hr>\n"
                  f"  <pre>{html.escape(res.stdout)}</pre>\n"
                  "  <hr>\n"
                  f"  <p><a href=\"/shelf/man/{sec}/\">Back to man({sec})</a></p>\n"
                  "</body>\n</html>\n"
              )
              (sec_dir / safe_file).write_text(page_html, encoding="utf-8")
              return (sec, name, safe_file)

          tasks = []
          for sec in SECTIONS:
              sec_dir = base_out / sec
              sec_dir.mkdir(parents=True, exist_ok=True)
              src_dir = Path(f"/usr/share/man/man{sec}")
              if src_dir.exists():
                  for p in sorted(src_dir.glob(f"*.{sec}*.gz")):
                      tasks.append((sec, p))

          by_sec = {s: [] for s in SECTIONS}
          with ThreadPoolExecutor(max_workers=os.cpu_count() or 4) as pool:
              for result in pool.map(render_one, tasks):
                  if result:
                      sec, name, safe_file = result
                      by_sec[sec].append((name, safe_file))

          # Build section indexes
          sec_links = []
          for sec, desc in SECTIONS.items():
              items = sorted(set(by_sec[sec]), key=lambda x: x[0].lower())
              li = "\n".join(
                  f'    <li><a href="{html.escape(f)}">{html.escape(n)}({sec})</a></li>'
                  for n, f in items
              )
              sec_index = (
                  "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n"
                  "  <meta charset=\"UTF-8\">\n"
                  f"  <title>man({sec}) - {html.escape(desc)} - inetdotlib.ftp.sh</title>\n"
                  "</head>\n<body>\n"
                  f"  <h1>man({sec}) &mdash; {html.escape(desc)}</h1>\n"
                  "  <p><a href=\"/\">Home</a> | <a href=\"/shelf/man/\">All Sections</a></p>\n"
                  "  <hr>\n"
                  f"  <p>Total pages: {len(items)}</p>\n"
                  f"  <ul>\n{li}\n  </ul>\n"
                  "</body>\n</html>\n"
              )
              (base_out / sec / "index.html").write_text(sec_index, encoding="utf-8")
              sec_links.append(
                  f'    <li><a href="/shelf/man/{sec}/"><b>man({sec})</b></a> &mdash; {html.escape(desc)} ({len(items)} pages)</li>'
              )

          # Build root /shelf/man/index.html
          root_index = (
              "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n"
              "  <meta charset=\"UTF-8\">\n"
              "  <title>Manual Pages (1-8) - inetdotlib.ftp.sh</title>\n"
              "</head>\n<body>\n"
              "  <h1>Unix / Linux Manual Pages</h1>\n"
              "  <p><a href=\"/\">Home</a> | <a href=\"/pub/\">/pub</a></p>\n"
              "  <hr>\n"
              f"  <ul>\n{chr(10).join(sec_links)}\n  </ul>\n"
              "</body>\n</html>\n"
          )
          (base_out / "index.html").write_text(root_index, encoding="utf-8")
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4