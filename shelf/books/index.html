<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Domain Books - inetdotlib.ftp.sh</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
        #status { color: #888; margin-bottom: 1rem; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 0.6rem 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        a.book-link { color: #4ea1f3; text-decoration: none; cursor: pointer; }
        a.book-link:hover { text-decoration: underline; }
        .badge { background: #222; border: 1px solid #333; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; color: #aaa; flex-shrink: 0; }
        button { background: #222; color: #eee; border: 1px solid #444; padding: 0.6rem 1.2rem; cursor: pointer; font-family: monospace; margin-top: 1rem; }
        button:hover { background: #333; }
        #reader { margin: 1.5rem 0; border: 1px solid #444; padding: 1rem; display: none; background: #181818; }
        #reader-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-bottom: 1rem; gap: 1rem; }
        #txt-viewer { white-space: pre-wrap; max-height: 75vh; overflow-y: auto; line-height: 1.6; font-size: 0.95rem; }
        #pdf-viewer { width: 100%; height: 80vh; border: none; background: #fff; }
    </style>
</head>
<body>

    <h1>PUBLIC-DOMAIN BOOKS</h1>
    <div id="status">Loading catalog...</div>

    <!-- In-Browser Reader -->
    <div id="reader">
        <div id="reader-header">
            <strong id="reader-title">Book Title</strong>
            <div>
                <a id="raw-download" href="#" target="_blank" rel="noopener" style="color:#4ea1f3; margin-right:1rem; font-size:0.85rem;">[Download Raw]</a>
                <button type="button" onclick="closeReader()" style="margin:0;">[X] Close</button>
            </div>
        </div>
        <div id="txt-viewer"></div>
        <iframe id="pdf-viewer" style="display:none;"></iframe>
    </div>

    <!-- Book Catalog -->
    <ul id="book-list"></ul>
    <button id="show-more-btn" type="button" style="display:none;" onclick="renderNext(100)">Show More (+100)</button>

    <script>
        const REPO = "mk-2015/internet-books";
        const BRANCH = "main";
        const BASE_PATH = "books";
        const CACHE_KEY = "inetdotlib_books_cache_v1";
        const CACHE_TTL = 15 * 60 * 1000; // 15 minutes

        let allBooks = [];
        let renderedCount = 0;

        function buildRawUrl(path) {
            const encoded = path.split("/").map(encodeURIComponent).join("/");
            return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encoded}`;
        }

        async function loadCatalog() {
            const status = document.getElementById("status");

            try {
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
                if (cached && Array.isArray(cached.books) && Date.now() - cached.time < CACHE_TTL) {
                    allBooks = cached.books;
                } else {
                    const treeUrl = `https://api.github.com/repos/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
                    const res = await fetch(treeUrl, {
                        headers: { "Accept": "application/vnd.github+json" }
                    });
                    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
                    const data = await res.json();

                    allBooks = (data.tree || [])
                        .filter(item =>
                            item.type === "blob" &&
                            (item.path.startsWith(`${BASE_PATH}/pdf/`) || item.path.startsWith(`${BASE_PATH}/txt/`))
                        )
                        .map(item => {
                            const filename = item.path.split("/").pop();
                            const type = item.path.startsWith(`${BASE_PATH}/pdf/`) ? "pdf" : "txt";
                            const title = filename.replace(/\.(pdf|txt)$/i, "").replace(/[-_]+/g, " ");
                            return { path: item.path, title, type, size: item.size || 0 };
                        })
                        .sort((a, b) => a.title.localeCompare(b.title));

                    localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), books: allBooks }));
                }

                renderNext(50);
            } catch (err) {
                status.textContent = `Failed to load catalog from GitHub (${err.message}).`;
                console.error(err);
            }
        }

        function renderNext(count) {
            const list = document.getElementById("book-list");
            const status = document.getElementById("status");
            const btn = document.getElementById("show-more-btn");

            const slice = allBooks.slice(renderedCount, renderedCount + count);
            slice.forEach(book => {
                const li = document.createElement("li");

                const link = document.createElement("a");
                link.className = "book-link";
                link.textContent = book.title;
                link.href = `#book=${encodeURIComponent(book.path)}`;
                link.onclick = (e) => {
                    e.preventDefault();
                    openBook(book);
                };

                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = book.type.toUpperCase();

                li.appendChild(link);
                li.appendChild(badge);
                list.appendChild(li);
            });

            renderedCount += slice.length;
            status.textContent = `Showing ${renderedCount} of ${allBooks.length} books`;
            btn.style.display = renderedCount < allBooks.length ? "inline-block" : "none";
        }

        async function openBook(book) {
            const reader = document.getElementById("reader");
            const readerTitle = document.getElementById("reader-title");
            const rawLink = document.getElementById("raw-download");
            const txtViewer = document.getElementById("txt-viewer");
            const pdfViewer = document.getElementById("pdf-viewer");

            const rawUrl = buildRawUrl(book.path);

            reader.style.display = "block";
            readerTitle.textContent = `Loading: ${book.title}...`;
            rawLink.href = rawUrl;
            txtViewer.style.display = "none";
            pdfViewer.style.display = "none";
            pdfViewer.src = "";
            reader.scrollIntoView({ behavior: "smooth" });

            try {
                if (book.type === "txt") {
                    const res = await fetch(rawUrl);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    txtViewer.textContent = await res.text();
                    txtViewer.style.display = "block";
                } else {
                    pdfViewer.src = rawUrl;
                    pdfViewer.style.display = "block";
                }
                readerTitle.textContent = book.title;
            } catch (err) {
                readerTitle.textContent = `Error loading: ${book.title} (${err.message})`;
                console.error(err);
            }
        }

        function closeReader() {
            document.getElementById("reader").style.display = "none";
            document.getElementById("pdf-viewer").src = "";
            document.getElementById("txt-viewer").textContent = "";
        }

        loadCatalog();
    </script>
</body>
</html>
