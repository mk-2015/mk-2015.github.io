<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Freeze - inetdotlib.ftp.sh</title>
</head>
<body>
  <h1>FREEZE</h1>
  <p>Leave a permanent message in <tt>the internet books</tt>.</p>
  <hr>

  <form id="freeze-form">
    <p>
      <label for="name"><b>Username</b> (ALL CAPS, A-Z / 0-9 only):</label><br>
      <input type="text" id="name" maxlength="20" required placeholder="ANNABLEJ">
    </p>
    <p>
      <label for="message"><b>Message</b> (<span id="count">0</span>/250 chars):</label><br>
      <textarea id="message" rows="4" cols="50" maxlength="250" required></textarea>
    </p>
    <p>
      <button type="submit" id="submit-btn">Freeze Message</button>
      <span id="status"></span>
    </p>
  </form>

  <hr>
  <h2>Freezes <small id="   -count"></small></h2>
  <div id="feed">Loading freezes...</div>
  <p><button type="button" id="show-more-btn" hidden>Show More</button></p>

  <script>
    const WORKER_URL = "https://inetdotlib-freeze.sxcyber17.workers.dev";
    const PAGE_SIZE = 50;

    const form = document.getElementById("freeze-form");
    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("message");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const feedEl = document.getElementById("feed");
    const totalCountEl = document.getElementById("total-count");
    const showMoreBtn = document.getElementById("show-more-btn");

    let begin = 0;
    let end = PAGE_SIZE;
    let loadedCount = 0;

    nameInput.addEventListener("input", () => {
      nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    });

    msgInput.addEventListener("input", () => {
      countEl.textContent = msgInput.value.length;
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBatch(entries, append) {
      const html = entries.map(item => `
        <p>
          <b>[${escapeHtml(item.name)}]</b>
          <small>(${escapeHtml(item.date || "")})</small><br>
          ${escapeHtml(item.message)}
        </p>
        <hr>
      `).join("");

      if (append) {
        feedEl.insertAdjacentHTML("beforeend", html);
      } else {
        feedEl.innerHTML = entries.length ? html : "<p>No freezes yet. Be the first.</p>";
      }
    }

    async function fetchRange(append = false) {
      showMoreBtn.disabled = true;
      try {
        const res = await fetch(`${WORKER_URL}/?begin=${begin}&end=${end}&t=${Date.now()}`);
        if (!res.ok) throw new Error("Worker GET failed");
        const data = await res.json();
        const batch = Array.isArray(data.entries) ? data.entries : [];

        renderBatch(batch, append);
        loadedCount += batch.length;

        const total = Number.isFinite(data.total) ? data.total : loadedCount;
        totalCountEl.textContent = total > 0 ? `(showing ${loadedCount} of ${total})` : "";

        if (data.hasMore) {
          const remaining = total - loadedCount;
          showMoreBtn.textContent = `Show More (${remaining} remaining)`;
          showMoreBtn.hidden = false;
        } else {
          showMoreBtn.hidden = true;
        }
      } catch {
        if (!append) feedEl.textContent = "Failed to load freezes.";
        showMoreBtn.hidden = true;
      } finally {
        showMoreBtn.disabled = false;
      }
    }

    showMoreBtn.addEventListener("click", () => {
      begin = end;
      end = end + PAGE_SIZE;
      fetchRange(true);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const message = msgInput.value.trim();

      if (!/^[A-Z0-9]{1,20}$/.test(name)) {
        statusEl.textContent = " Username must be ALL CAPS alphanumeric.";
        return;
      }
      if (!message || message.length > 250) {
        statusEl.textContent = " Message must be 1-250 characters.";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = " Freezing...";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, message })
        });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = " " + (data.error || "Rejected.");
        } else {
          statusEl.textContent = " Frozen!";
          msgInput.value = "";
          countEl.textContent = "0";
          begin = 0;
          end = PAGE_SIZE;
          loadedCount = 0;
          fetchRange(false);
        }
      } catch {
        statusEl.textContent = " Network error contacting Worker.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    fetchRange(false);
  </script>
</body>
</html>
