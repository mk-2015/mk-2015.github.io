<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ping Pong (2-Player)</title>
  <style>
    body {
      background: #c0c0c0;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
      max-width: 560px;
      margin: 20px auto;
      padding: 0 10px;
    }
    a { color: #0000ee; }
    a:visited { color: #551a8b; }
    fieldset {
      border: 2px groove #ffffff;
      padding: 10px 14px;
      background: #d4d0c8;
    }
    legend {
      font-weight: bold;
      padding: 0 6px;
    }
    canvas {
      background: #0b1911;
      border: 2px inset #808080;
      display: block;
      margin: 8px 0 4px 0;
    }
    button {
      background: #c0c0c0;
      color: #000000;
      border: 2px outset #ffffff;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:active {
      border-style: inset;
    }
  </style>
  <link rel="stylesheet" href="/static/global.css">
</head>
<body>
  <p><a href="/">Home</a> | <a href="/games/">Games</a></p>
  <h1>Ping Pong</h1>
  <hr>

  <fieldset>
    <legend>Table (First to 7 Wins)</legend>
    <p>
      <strong>P1 (W / S):</strong> <span id="s1">0</span> &nbsp;|&nbsp;
      <strong>P2 (Up / Down):</strong> <span id="s2">0</span> &nbsp;|&nbsp;
      <span id="status">Press Start or Space</span>
    </p>
    <canvas id="court" width="500" height="300"></canvas>
  </fieldset>

  <p>
    <button type="button" onclick="startMatch()">New Match</button>
    <label><input type="checkbox" id="cpu"> P2 = CPU Bot</label>
  </p>

  <script>
    const canvas = document.getElementById("court");
    const ctx = canvas.getContext("2d");
    const s1El = document.getElementById("s1");
    const s2El = document.getElementById("s2");
    const statusEl = document.getElementById("status");
    const cpuBox = document.getElementById("cpu");

    const PAD_W = 10, PAD_H = 64, PAD_SPEED = 5.5, WIN_SCORE = 7;
    let p1, p2, ball, score1 = 0, score2 = 0, running = false, rafId = null;
    const keys = {};

    function resetPositions(dir = 1) {
      p1 = { x: 14, y: canvas.height / 2 - PAD_H / 2 };
      p2 = { x: canvas.width - 14 - PAD_W, y: canvas.height / 2 - PAD_H / 2 };
      const angle = (Math.random() * 0.6 - 0.3);
      const speed = 4.6;
      ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        r: 7,
        vx: Math.cos(angle) * speed * dir,
        vy: Math.sin(angle) * speed
      };
    }

    function draw() {
      ctx.fillStyle = "#0b1911";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#2e5c40";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#193826";
      ctx.font = "bold 48px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(score1, canvas.width * 0.25, 65);
      ctx.fillText(score2, canvas.width * 0.75, 65);

      ctx.fillStyle = "#44ff44";
      ctx.fillRect(p1.x, p1.y, PAD_W, PAD_H);
      ctx.fillStyle = "#ffcc33";
      ctx.fillRect(p2.x, p2.y, PAD_W, PAD_H);

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function update() {
      if (keys["w"]) p1.y -= PAD_SPEED;
      if (keys["s"]) p1.y += PAD_SPEED;

      if (cpuBox.checked) {
        const center = p2.y + PAD_H / 2;
        if (ball.vx > 0) {
          if (center < ball.y - 8) p2.y += PAD_SPEED * 0.78;
          else if (center > ball.y + 8) p2.y -= PAD_SPEED * 0.78;
        }
      } else {
        if (keys["arrowup"]) p2.y -= PAD_SPEED;
        if (keys["arrowdown"]) p2.y += PAD_SPEED;
      }

      p1.y = Math.max(0, Math.min(canvas.height - PAD_H, p1.y));
      p2.y = Math.max(0, Math.min(canvas.height - PAD_H, p2.y));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy *= -1;
        ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));
      }

      if (
        ball.vx < 0 &&
        ball.x - ball.r <= p1.x + PAD_W &&
        ball.x + ball.r >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + PAD_H
      ) {
        const hit = (ball.y - (p1.y + PAD_H / 2)) / (PAD_H / 2);
        const speed = Math.min(9.5, Math.hypot(ball.vx, ball.vy) + 0.3);
        const angle = hit * 0.9;
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        ball.x = p1.x + PAD_W + ball.r;
      }

      if (
        ball.vx > 0 &&
        ball.x + ball.r >= p2.x &&
        ball.x - ball.r <= p2.x + PAD_W &&
        ball.y >= p2.y &&
        ball.y <= p2.y + PAD_H
      ) {
        const hit = (ball.y - (p2.y + PAD_H / 2)) / (PAD_H / 2);
        const speed = Math.min(9.5, Math.hypot(ball.vx, ball.vy) + 0.3);
        const angle = hit * 0.9;
        ball.vx = -Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        ball.x = p2.x - ball.r;
      }

      if (ball.x < 0) {
        score2++;
        s2El.textContent = score2;
        checkWin(-1);
      } else if (ball.x > canvas.width) {
        score1++;
        s1El.textContent = score1;
        checkWin(1);
      }
    }

    function checkWin(nextDir) {
      if (score1 >= WIN_SCORE || score2 >= WIN_SCORE) {
        running = false;
        draw();
        const winner = score1 >= WIN_SCORE ? "PLAYER 1 WINS!" : (cpuBox.checked ? "CPU WINS!" : "PLAYER 2 WINS!");
        statusEl.textContent = winner + " Press New Match.";
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#44ff44";
        ctx.font = "bold 28px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText(winner, canvas.width / 2, canvas.height / 2);
      } else {
        resetPositions(nextDir);
      }
    }

    function loop() {
      if (!running) return;
      update();
      if (running) {
        draw();
        rafId = requestAnimationFrame(loop);
      }
    }

    function startMatch() {
      cancelAnimationFrame(rafId);
      score1 = 0;
      score2 = 0;
      s1El.textContent = "0";
      s2El.textContent = "0";
      statusEl.textContent = "Playing! First to 7 wins.";
      running = true;
      resetPositions(Math.random() < 0.5 ? 1 : -1);
      loop();
    }

    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (["arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
      keys[k] = true;
      if (k === " " && !running) startMatch();
    });

    document.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    resetPositions(1);
    draw();
  </script>
</body>
</html>
