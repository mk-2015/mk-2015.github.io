<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINESWEEPER - inetdotlib.ftp.sh</title>
  <link rel="stylesheet" href="/static/global.css">
</head>
<body>
  <h1>MINESWEEPER</h1>
  <hr>

  <p>
    <b>Difficulty:</b>
    <button type="button" data-preset="9x9x10">Beginner (9x9)</button>
    <button type="button" data-preset="16x16x40">Intermediate (16x16)</button>
    <button type="button" data-preset="16x30x99">Expert (30x16)</button>
  </p>

  <p>
    <b>MINES LEFT:</b> <tt id="mines-left">010</tt> |
    <button type="button" id="reset-btn"><b>[:]</b> Reset</button> |
    <b>TIME:</b> <tt id="timer">000</tt>s |
    <label><input type="checkbox" id="flag-mode"> Flag Click Mode</label>
  </p>

  <p id="status-msg"></p>
  <div id="grid-wrap"></div>

  <hr>
  <p><tt>Controls: Left-click = Reveal tile | Right-click (or Flag Click Mode) = Toggle flag [F].</tt></p>
  <p><tt><a href="./index.html">&larr; Back to Games</a></tt></p>

  <script>
    const gridWrap = document.getElementById("grid-wrap");
    const minesLeftEl = document.getElementById("mines-left");
    const resetBtn = document.getElementById("reset-btn");
    const timerEl = document.getElementById("timer");
    const flagModeEl = document.getElementById("flag-mode");
    const statusMsgEl = document.getElementById("status-msg");

    let rows = 9;
    let cols = 9;
    let totalMines = 10;

    let board = [];
    let revealed = [];
    let flagged = [];
    let minePlaced = false;
    let gameOver = false;
    let won = false;
    let seconds = 0;
    let timerId = null;

    function pad3(n) {
      return String(Math.max(0, Math.min(999, n))).padStart(3, "0");
    }

    function stopTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startTimer() {
      if (timerId !== null) return;
      timerId = setInterval(() => {
        if (!gameOver && !won) {
          seconds += 1;
          timerEl.textContent = pad3(seconds);
        }
      }, 1000);
    }

    function updateCounters() {
      let flagCount = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (flagged[r][c]) flagCount++;
        }
      }
      minesLeftEl.textContent = pad3(totalMines - flagCount);
    }

    function initBoard() {
      stopTimer();
      seconds = 0;
      timerEl.textContent = "000";
      minePlaced = false;
      gameOver = false;
      won = false;
      statusMsgEl.innerHTML = "";
      resetBtn.innerHTML = "<b>[:]</b> Reset";

      board = Array.from({ length: rows }, () => Array(cols).fill(0));
      revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
      flagged = Array.from({ length: rows }, () => Array(cols).fill(false));

      updateCounters();
      renderBoard();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        const nearSafe = Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1;
        if (board[r][c] !== -1 && !nearSafe) {
          board[r][c] = -1;
          placed++;
        }
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] === -1) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) {
                count++;
              }
            }
          }
          board[r][c] = count;
        }
      }

      minePlaced = true;
      startTimer();
    }

    function floodReveal(startR, startC) {
      const queue = [[startR, startC]];
      while (queue.length > 0) {
        const [r, c] = queue.shift();
        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
        if (revealed[r][c] || flagged[r][c]) continue;

        revealed[r][c] = true;

        if (board[r][c] === 0) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr !== 0 || dc !== 0) {
                queue.push([r + dr, c + dc]);
              }
            }
          }
        }
      }
    }

    function checkWin() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] !== -1 && !revealed[r][c]) {
            return false;
          }
        }
      }
      won = true;
      stopTimer();
      resetBtn.innerHTML = "<b>[B)]</b> Won!";
      statusMsgEl.innerHTML = `<b>FIELD CLEARED IN ${seconds}s!</b>`;
      return true;
    }

    function handleReveal(r, c) {
      if (gameOver || won || revealed[r][c] || flagged[r][c]) return;

      if (!minePlaced) {
        placeMines(r, c);
      }

      if (board[r][c] === -1) {
        revealed[r][c] = true;
        gameOver = true;
        stopTimer();
        resetBtn.innerHTML = "<b>[X_X]</b> Boom";
        statusMsgEl.innerHTML = "<b>BOOM! HIT A MINE.</b> Click Reset to try again.";
        for (let rr = 0; rr < rows; rr++) {
          for (let cc = 0; cc < cols; cc++) {
            if (board[rr][cc] === -1) revealed[rr][cc] = true;
          }
        }
        renderBoard();
        return;
      }

      floodReveal(r, c);
      checkWin();
      renderBoard();
    }

    function handleFlag(r, c) {
      if (gameOver || won || revealed[r][c]) return;
      flagged[r][c] = !flagged[r][c];
      updateCounters();
      renderBoard();
    }

    function renderBoard() {
      let html = '<table border="1" cellpadding="0" cellspacing="0" style="border-collapse: collapse; user-select: none;">';
      for (let r = 0; r < rows; r++) {
        html += "<tr>";
        for (let c = 0; c < cols; c++) {
          let label = "&nbsp;";
          let bg = "#c0c0c0";
          let fg = "#000000";

          if (revealed[r][c]) {
            bg = "#e8e8e8";
            if (board[r][c] === -1) {
              label = "*";
              bg = "#ff6666";
            } else if (board[r][c] > 0) {
              label = String(board[r][c]);
              const colors = ["", "#0000aa", "#007700", "#aa0000", "#000066", "#770000", "#007777", "#222222", "#555555"];
              fg = colors[board[r][c]] || "#000000";
            }
          } else if (flagged[r][c]) {
            label = "F";
            bg = "#ffff99";
            fg = "#aa0000";
          }

          html += `<td align="center" valign="middle" width="28" height="28" data-r="${r}" data-c="${c}" style="background:${bg};color:${fg};font-family:monospace;font-weight:bold;cursor:pointer;">${label}</td>`;
        }
        html += "</tr>";
      }
      html += "</table>";
      gridWrap.innerHTML = html;
    }

    gridWrap.addEventListener("click", (e) => {
      const td = e.target.closest("td[data-r]");
      if (!td) return;
      const r = Number(td.dataset.r);
      const c = Number(td.dataset.c);
      if (flagModeEl.checked) {
        handleFlag(r, c);
      } else {
        handleReveal(r, c);
      }
    });

    gridWrap.addEventListener("contextmenu", (e) => {
      const td = e.target.closest("td[data-r]");
      if (!td) return;
      e.preventDefault();
      handleFlag(Number(td.dataset.r), Number(td.dataset.c));
    });

    document.querySelectorAll("button[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const [r, c, m] = btn.dataset.preset.split("x").map(Number);
        rows = r;
        cols = c;
        totalMines = m;
        initBoard();
      });
    });

    resetBtn.addEventListener("click", initBoard);

    initBoard();
  </script>
</body>
</html>
